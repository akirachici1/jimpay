<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pengaturan Admin — JimPAY</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .settings-card { background: var(--putih); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; max-width: 500px; margin: 0 auto; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    JimPAY
  </div>
  <div class="topbar-spacer"></div>
  <div class="topbar-user">
    <span class="badge badge-info" style="font-size:11px;">Admin</span>
    <span class="avatar" style="background:var(--hijau-muda);color:var(--hijau);">KR</span>
    <div>
      <div style="font-size:13px;font-weight:500;color:var(--teks);"><a href="admin-pengaturan.html" style="color:inherit;text-decoration:none;" id="admin-name">Memuat...</a></div>
    </div>
    <a href="#" onclick="apiLogout()" class="btn btn-outline btn-sm" style="margin-left:8px;">Keluar</a>
  </div>
</div>

<div class="layout-admin">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-section">Menu</div>
    <a href="admin-dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="admin-verifikasi.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Verifikasi Dokumen
    </a>
    <div class="sidebar-section">Data</div>
    <a href="admin-warga.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Data Warga
    </a>
    <a href="admin-laporan.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 100 7h5a3.5 3.5 0 110 7H6"/></svg>
      Kas &amp; Laporan
    </a>
  </div>

  <!-- MAIN -->
  <div class="main-content">
    <div class="page-header">
      <div class="page-title">Pengaturan Akun Admin</div>
      <div class="page-sub">Ubah username dan password akun Anda.</div>
    </div>

    <div class="settings-card">
      <div class="form-group">
        <label class="form-label">Username Baru</label>
        <input type="text" class="form-input" id="inp-username" placeholder="Masukkan username baru (opsional)" />
      </div>
      <div class="form-group">
        <label class="form-label">Password Lama *</label>
        <input type="password" class="form-input" id="inp-old-pass" placeholder="Diperlukan untuk menyimpan perubahan" />
      </div>
      <div class="form-group">
        <label class="form-label">Password Baru</label>
        <input type="password" class="form-input" id="inp-new-pass" placeholder="Biarkan kosong jika tidak ingin mengubah" />
      </div>
      <button class="btn btn-primary btn-full" id="btn-save" onclick="simpanPengaturan()">Simpan Perubahan</button>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
  function init() {
    const user = getAuthUser();
    if (!user || user.role !== 'admin') {
      window.location.href = 'login.html';
      return;
    }
    document.getElementById('admin-name').textContent = user.nama;
    document.getElementById('inp-username').value = user.username;
  }

  async function simpanPengaturan() {
    const newUsername = document.getElementById('inp-username').value.trim();
    const oldPass = document.getElementById('inp-old-pass').value;
    const newPass = document.getElementById('inp-new-pass').value;

    if(!oldPass) {
      alert('Password lama wajib diisi untuk keamanan.');
      return;
    }

    const btn = document.getElementById('btn-save');
    btn.textContent = 'Menyimpan...';
    btn.disabled = true;

    try {
      await apiUpdateProfil({
        username: newUsername,
        old_password: oldPass,
        new_password: newPass
      });
      alert('Profil berhasil diubah! Jika Anda mengubah username, silakan login kembali nanti.');
      document.getElementById('inp-old-pass').value = '';
      document.getElementById('inp-new-pass').value = '';
      
      // Update session data
      const user = getAuthUser();
      user.username = newUsername;
      localStorage.setItem('jimpitan_user', JSON.stringify(user));

    } catch(err) {
      alert(err.message);
    } finally {
      btn.textContent = 'Simpan Perubahan';
      btn.disabled = false;
    }
  }

  init();
</script>
</body>
</html>
