<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pengaturan Akun — JimPAY</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .settings-card { background: var(--putih); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; max-width: 500px; margin: 0 auto; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    JimPAY
  </div>
  <div class="topbar-spacer"></div>
  <div class="topbar-user">
    <span class="badge badge-lunas" style="font-size:11px;">Warga</span>
    <span class="avatar" style="background:var(--biru-muda);color:var(--biru);" id="warga-avatar">W</span>
    <div>
      <div style="font-size:13px;font-weight:500;color:var(--teks);"><a href="warga-pengaturan.html" style="color:inherit;text-decoration:none;" id="warga-name">Memuat...</a></div>
    </div>
    <a href="#" onclick="apiLogout()" class="btn btn-outline btn-sm" style="margin-left:8px;">Keluar</a>
  </div>
</div>

<div class="layout-warga" style="max-width:800px; margin: 40px auto; padding: 0 20px;">
  <a href="warga-dashboard.html" class="btn btn-outline btn-sm" style="margin-bottom:20px;display:inline-flex;align-items:center;gap:6px;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Kembali ke Dasbor
  </a>

  <div class="page-header">
    <div class="page-title">Pengaturan Akun</div>
    <div class="page-sub">Ubah kata sandi Anda untuk menjaga keamanan akun.</div>
  </div>

  <div class="settings-card">
    <div class="form-group">
      <label class="form-label">Username (Hanya bisa diubah oleh admin)</label>
      <input type="text" class="form-input" id="inp-username" readonly style="background:var(--abu-muda); cursor:not-allowed;" />
    </div>
    <div class="form-group">
      <label class="form-label">Password Lama</label>
      <input type="password" class="form-input" id="inp-old-pass" placeholder="Masukkan password lama" />
    </div>
    <div class="form-group">
      <label class="form-label">Password Baru</label>
      <input type="password" class="form-input" id="inp-new-pass" placeholder="Masukkan password baru" />
    </div>
    <div class="form-group">
      <label class="form-label">Konfirmasi Password Baru</label>
      <input type="password" class="form-input" id="inp-confirm-pass" placeholder="Ulangi password baru" />
    </div>
    <button class="btn btn-primary btn-full" id="btn-save" onclick="simpanPengaturan()">Simpan Perubahan</button>
  </div>
</div>

<script src="api.js"></script>
<script>
  function init() {
    const user = getAuthUser();
    if (!user || user.role !== 'warga') {
      window.location.href = 'login.html';
      return;
    }
    document.getElementById('warga-name').textContent = user.nama;
    document.getElementById('warga-avatar').textContent = user.nama.substring(0,2).toUpperCase();
    document.getElementById('inp-username').value = user.username;
  }

  async function simpanPengaturan() {
    const oldPass = document.getElementById('inp-old-pass').value;
    const newPass = document.getElementById('inp-new-pass').value;
    const confirmPass = document.getElementById('inp-confirm-pass').value;

    if(!oldPass || !newPass || !confirmPass) {
      alert('Semua kolom password harus diisi.');
      return;
    }
    if(newPass !== confirmPass) {
      alert('Password baru dan konfirmasi password tidak cocok.');
      return;
    }

    const btn = document.getElementById('btn-save');
    btn.textContent = 'Menyimpan...';
    btn.disabled = true;

    try {
      await apiUpdateProfil({
        old_password: oldPass,
        new_password: newPass
      });
      alert('Password berhasil diubah!');
      document.getElementById('inp-old-pass').value = '';
      document.getElementById('inp-new-pass').value = '';
      document.getElementById('inp-confirm-pass').value = '';
    } catch(err) {
      alert(err.message);
    } finally {
      btn.textContent = 'Simpan Perubahan';
      btn.disabled = false;
    }
  }

  init();
</script>
</body>
</html>
